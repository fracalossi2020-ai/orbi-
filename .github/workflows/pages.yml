# Versão vitrine do site no GitHub Pages (páginas prontas, sem servidor): usuario.github.io/<nome do repositório>.
# Roda a cada envio para a main. No GitHub: Settings › Pages › Source = "GitHub Actions".
# WhatsApp do botão de contato: Settings › Secrets and variables › Actions › Variables › WHATSAPP (só números, com 55 e DDD).
name: Site no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/build-pages.mjs "${{ github.event.repository.name }}"
        env:
          NEXT_PUBLIC_WHATSAPP: ${{ vars.WHATSAPP }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
